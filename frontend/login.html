<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ChronoFlux</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #0f172a; background: #f1f5f9; }
  .brand { flex: 1; background: linear-gradient(150deg, #0b1f33 0%, #0f3b4d 55%, #0d9488 100%); color: #e2f3f2; padding: 56px; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 20px; }
  .logo span { width: 40px; height: 40px; border-radius: 10px; background: #14b8a6; color: #fff; display: grid; place-items: center; font-size: 14px; }
  .brand h1 { font-size: 34px; line-height: 1.2; margin: 0 0 14px; max-width: 460px; }
  .brand p { color: #a7d3cf; max-width: 440px; line-height: 1.6; margin: 0; }
  .flow { font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 2px; color: #5eead4; }
  .panel { width: 440px; display: flex; align-items: center; justify-content: center; padding: 40px; }
  form { width: 100%; max-width: 340px; }
  h2 { margin: 0 0 6px; font-size: 22px; }
  .sub { color: #64748b; font-size: 14px; margin: 0 0 28px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
  input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; margin-bottom: 16px; background: #fff; }
  input:focus { outline: 2px solid #14b8a6; border-color: transparent; }
  button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: #0d9488; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { background: #0f766e; } button:disabled { opacity: .6; }
  .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  @media (max-width: 820px) { .brand { display: none; } .panel { width: 100%; } }
</style>
</head>
<body>
  <div class="brand">
    <div class="logo"><span>CF</span> ChronoFlux</div>
    <div>
      <h1>AI-based network attack forecasting</h1>
      <p>Detect what is happening now, forecast the next attack stage, and keep a tamper-evident record of every elevated event.</p>
    </div>
    <div class="flow">DETECT → FORECAST → OBSERVE → VERIFY</div>
  </div>
  <div class="panel">
    <form id="f">
      <h2>Sign in</h2>
      <p class="sub">Security operations console</p>
      <label for="u">Username</label>
      <input id="u" autocomplete="username" required autofocus>
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" required>
      <div class="err" id="err"></div>
      <button id="b" type="submit">Sign in</button>
    </form>
  </div>
<script>
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const b = document.getElementById("b"), err = document.getElementById("err");
  b.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value, password: document.getElementById("p").value }) });
    const body = await r.json();
    if (r.ok) { sessionStorage.setItem("cf_csrf", body.csrf); location.href = "/"; return; }
    err.textContent = body.detail || "Sign-in failed";
  } catch (x) { err.textContent = "Server unreachable"; }
  b.disabled = false;
});
</script>
</body>
</html>
